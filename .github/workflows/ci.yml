name: IAM Server CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test & Security Scan
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: iam_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: RAMGARU
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Run Unit & Integration Tests
        run: ./gradlew test --no-daemon

      - name: Build Production JAR
        run: ./gradlew bootJar --no-daemon

      - name: Check Dependency Graph Availability
        id: dependency-graph
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const status = repo?.security_and_analysis?.dependency_graph?.status;
            const enabled = status === 'enabled';
            core.info(`Dependency graph status: ${status ?? 'unknown'}`);
            core.setOutput('enabled', enabled ? 'true' : 'false');

      - name: Security Vulnerability Scan (Dependency Review)
        uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request' && steps.dependency-graph.outputs.enabled == 'true'
        continue-on-error: true

      - name: Verify Docker Container Build
        run: docker build -t iam-server:ci .
