apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-server-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: iam-server
  template:
    metadata:
      labels:
        app: iam-server
    spec:
      containers:
        - name: iam-server
          image: iam-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: iam-server-config
            - secretRef:
                name: iam-server-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: iam-server-service
spec:
  type: NodePort
  selector:
    app: iam-server
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30090
