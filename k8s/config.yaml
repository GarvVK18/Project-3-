apiVersion: v1
kind: ConfigMap
metadata:
  name: iam-server-config
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/iam_db"
  SPRING_DATA_REDIS_HOST: "redis-service"
  SPRING_DATA_REDIS_PORT: "6379"
  SERVER_PORT: "9000"
---
apiVersion: v1
kind: Secret
metadata:
  name: iam-server-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_PASSWORD: "password123"
