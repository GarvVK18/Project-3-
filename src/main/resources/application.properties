spring.application.name=iam-server

server.port=9000

spring.datasource.url=jdbc:postgresql://localhost:5432/iam_db

spring.datasource.username=postgres

spring.datasource.password=RAMGARU

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true

# --- Redis Configuration (Week 3 Token Caching & Sessions) ---
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=2000ms

# --- SpringDoc OpenAPI / Swagger UI (Week 4 Productionization) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- Spring Boot Actuator Monitoring & Probes ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

